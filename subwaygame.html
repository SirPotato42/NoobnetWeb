var stations = dayStations; // whichever list we are playing right now
var night = false;

// what color each train bullet is
var colors = {
  "1":"red", "2":"red", "3":"red",
  "4":"green", "5":"green", "6":"green",
  "7":"purple",
  "A":"blue", "C":"blue", "E":"blue",
  "B":"orange", "D":"orange", "F":"orange", "M":"orange",
  "G":"lightgreen",
  "J":"brown", "Z":"brown",
  "L":"grey",
  "N":"yellow", "Q":"yellow", "R":"yellow", "W":"yellow",
  "S":"shuttle"
};

// words people shorten when they type a station name
var shortWords = {
  "st":"street", "sts":"street", "str":"street", "streets":"street",
  "av":"avenue", "ave":"avenue", "avs":"avenue", "aves":"avenue", "avenues":"avenue",
  "sq":"square", "ctr":"center", "cntr":"center", "centre":"center",
  "hts":"heights", "pl":"place", "blvd":"boulevard", "pkwy":"parkway", "pky":"parkway",
  "rd":"road", "dr":"drive", "ft":"fort", "jct":"junction",
  "w":"west", "e":"east", "n":"north", "s":"south",
  "wash":"washington", "bway":"broadway", "ny":"newyork", "nyc":"newyork",
  "univ":"university", "wtc":"worldtradecenter", "lex":"lexington"
};

var order = [];      // the stations shuffled up
var current = 0;     // which one we are on
var right = 0;       // how many the player got
var asked = 0;       // how many the player answered
var answered = false; // did they already answer this one
var timer = 0;       // countdown to the next station after a right answer

// take what somebody typed and squash it down so it is easy to compare
function clean(text) {
  text = text.toLowerCase();
  text = text.replace(/&/g, " and ");
  text = text.replace(/[^a-z0-9]/g, " ");
  var words = text.split(" ");
  var result = "";
  for (var i = 0; i < words.length; i++) {
    var word = words[i];
    if (word == "") {
      continue;
    }
    word = word.replace(/^([0-9]+)(st|nd|rd|th)$/, "$1"); // 42nd turns into 42
    if (shortWords[word]) {
      word = shortWords[word];
    }
    result = result + word;
  }
  return result;
}

// mix up the order so the game is different every time
function shuffle() {
  order = [];
  for (var i = 0; i < stations.length; i++) {
    order[i] = i;
  }
  for (var i = order.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = order[i];
    order[i] = order[j];
    order[j] = temp;
  }
}

// draw the little train circles
function showBullets() {
  var station = stations[order[current]];
  var html = "";
  for (var i = 0; i < station.routes.length; i++) {
    var route = station.routes[i];
    html = html + '<span class="bullet ' + colors[route] + '">' + route + '</span>';
  }
  document.getElementById("bullets").innerHTML = html;
}

function updateScore() {
  document.getElementById("score").innerHTML = "score: " + right + " right out of " + asked;
}

function checkAnswer() {
  if (answered == true) {
    return;
  }
  var typed = clean(document.getElementById("answer").value);
  if (typed == "") {
    return;
  }
  var station = stations[order[current]];
  var ok = false;
  if (typed == clean(station.name)) {
    ok = true;
  }
  for (var i = 0; i < station.alt.length; i++) {
    if (typed == clean(station.alt[i])) {
      ok = true;
    }
  }
  if (ok == true) {
    answered = true;
    asked = asked + 1;
    right = right + 1;
    document.getElementById("result").innerHTML =
      '<font color="green">RIGHT! ' + station.name + ' (' + station.boro + ')</font>';
    timer = setTimeout(nextStation, 900); // give them a second to see it then move on
    updateScore();
  } else {
    // dont tell them what it was, let them keep trying
    document.getElementById("result").innerHTML =
      '<font color="red">FUCK YOU!</font>';
    document.getElementById("answer").select();
  }
}

function showHint() {
  if (answered == true) {
    return;
  }
  var station = stations[order[current]];
  document.getElementById("result").innerHTML =
    "hint: it is in " + station.boro + " and has " + station.name.length + " letters";
}

// the give up button. if the answer is already on screen this just
// jumps to the next station instead of waiting for the timer
function giveUp() {
  if (answered == true) {
    nextStation();
    return;
  }
  var station = stations[order[current]];
  answered = true;
  asked = asked + 1;
  document.getElementById("result").innerHTML =
    '<font color="red">it was ' + station.name + ' (' + station.boro + ')</font>';
  updateScore();
  timer = setTimeout(nextStation, 1600); // show them the answer then move on
}

function nextStation() {
  clearTimeout(timer); // stop the countdown if they already clicked something
  current = current + 1;
  if (current >= order.length) {
    document.getElementById("bullets").innerHTML = "";
    document.getElementById("result").innerHTML =
      "THE END! you got " + right + " out of " + stations.length;
    document.getElementById("playarea").style.display = "none";
    return;
  }
  answered = false;
  document.getElementById("answer").value = "";
  document.getElementById("result").innerHTML = "&nbsp;";
  showBullets();
  document.getElementById("answer").focus();
}

// click NOON and the whole thing goes dark and switches to the
// late night trains. click MOON and it goes back to normal.
function toggleMode() {
  if (night == false) {
    night = true;
    stations = nightStations;
    document.body.className = "night";
    document.getElementById("smallprint").innerHTML =
      'Weekdays at <a href="javascript:toggleMode()">MOON</a>. David not approved!' +
      '<br>Only E 180 St and Myrtle Av are new here. The other 36 are one of a kind' +
      '<br>at NOON too, they just lose trains. 17 stations drop off the list.';
  } else {
    night = false;
    stations = dayStations;
    document.body.className = "";
    document.getElementById("smallprint").innerHTML =
      'Weekdays at <a href="javascript:toggleMode()">NOON</a>. David approved!';
  }
  startGame();
}

// wipe the score and deal out a fresh set
function startGame() {
  clearTimeout(timer);
  right = 0;
  asked = 0;
  current = 0;
  answered = false;
  shuffle();
  document.getElementById("playarea").style.display = "";
  document.getElementById("answer").value = "";
  document.getElementById("result").innerHTML = "&nbsp;";
  updateScore();
  showBullets();
  document.getElementById("answer").focus();
}

// start the game
startGame();

</script>
