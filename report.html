    <script>
      let typedBuffer = '';
      window.addEventListener('keydown', function handleKeydown(event) {
        if (event.defaultPrevented) return;
        const target = event.target;
        const isTypingContext =
          target && (
            target.tagName === 'INPUT' ||
            target.tagName === 'TEXTAREA' ||
            target.isContentEditable
          );
        if (isTypingContext) return;
        if (!event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey) {
          const key = String(event.key || '').toLowerCase();
          if (key === 'p') {
            window.location.href = 'https://cinema.noobular.top';
          }
          if (key === 's') {
            const splat = document.getElementById('splat-audio');
            if (splat && typeof splat.play === 'function') {
              try {
                splat.currentTime = 0;
                splat.play();
              } catch (e) {
              }
            }
          }
          if (key === 'g') {
            const green = document.getElementById('green-audio');
            if (green && typeof green.play === 'function') {
              try {
                green.currentTime = 0;
                green.play();
              } catch (e) {
              }
            }
          }
          if (key.length === 1 && key >= 'a' && key <= 'z') {
            typedBuffer += key;
            if (typedBuffer.length > 16) typedBuffer = typedBuffer.slice(-16);
            if (typedBuffer.endsWith('ricky')) {
              try {
                localStorage.setItem('REMOVE-EVERYTHING', '1');
              } catch (e) {}
              document.documentElement.classList.add('REMOVE-EVERYTHING');
              if (document.body) document.body.classList.add('REMOVE-EVERYTHING');
            } else if (typedBuffer.endsWith('sorry')) {
              try {
                localStorage.removeItem('REMOVE-EVERYTHING');
              } catch (e) {}
              document.documentElement.classList.remove('REMOVE-EVERYTHING');
              if (document.body) document.body.classList.remove('REMOVE-EVERYTHING');
            }
          }
        }
      });

      function showSignIn() {
        const popup = document.getElementById('signin-popup');
        const currentUser = localStorage.getItem('current-user');
        const signinForm = document.getElementById('signin-form');
        const signoutForm = document.getElementById('signout-form');
        const title = document.getElementById('signin-title');
        const usernameDisplay = document.getElementById('current-username-display');
        
        if (currentUser) {
          signinForm.style.display = 'none';
          signoutForm.style.display = 'block';
          title.textContent = 'ACCOUNT';
          usernameDisplay.textContent = currentUser;
        } else {
          signinForm.style.display = 'block';
          signoutForm.style.display = 'none';
          title.textContent = 'SIGN IN';
        }
        
        if (popup) {
          popup.style.display = 'flex';
        }
      }

      function updateSignInButton() {
        const currentUser = localStorage.getItem('current-user');
        const button = document.getElementById('signin-button');
        if (button && currentUser) {
          button.textContent = currentUser;
        }
      }

      function signOut() {
        localStorage.removeItem('current-user');
        const button = document.getElementById('signin-button');
        if (button) {
          button.textContent = 'SIGN IN';
        }
        hideSignIn();
      }

      window.addEventListener('load', updateSignInButton);

      setInterval(function() {
        const currentUser = localStorage.getItem('current-user');
        if (!currentUser) {
          alert('FREE TRIAL EXPIRED! Sign in to continue.');
        }
      }, 10000);

      function hideSignIn() {
        const popup = document.getElementById('signin-popup');
        if (popup) {
          popup.style.display = 'none';
        }
      }

      function signIn() {
        const username = document.getElementById('username-input').value;
        const password = document.getElementById('password-input').value;
        const status = document.getElementById('signin-status');
        
        if (!username || !password) {
          status.textContent = 'Please enter username and password!';
          return;
        }
        
        const accounts = JSON.parse(localStorage.getItem('noobular-accounts') || '{}');
        if (!accounts['ricky']) {
          accounts['ricky'] = 'ricky';
          localStorage.setItem('noobular-accounts', JSON.stringify(accounts));
        }
        
        if (accounts[username] && accounts[username] === password) {
          status.textContent = 'Welcome back, ' + username + '!';
          localStorage.setItem('current-user', username);
          updateSignInButton();
          setTimeout(() => {
            hideSignIn();
            status.textContent = '';
            document.getElementById('username-input').value = '';
            document.getElementById('password-input').value = '';
          }, 1500);
        } else {
          status.textContent = 'Invalid username or password!';
        }
      }

      function createAccount() {
        const username = document.getElementById('username-input').value;
        const password = document.getElementById('password-input').value;
        const status = document.getElementById('signin-status');
        
        if (!username || !password) {
          status.textContent = 'Please enter username and password!';
          return;
        }
        
        if (!window.usernameAttempts) {
          window.usernameAttempts = 0;
        }
        
        const hasMinLength = username.length >= 12;
        const hasMaxLength = username.length < 13;
        const hasNumber = /\d/.test(username);
        const hasCapital = /[A-Z]/.test(username);
        const hasSpecial = /[!@#$%^&*()q,.?":{}|<>]/.test(username);
        const hasNoobular = username.includes('I<3NOOBULAR');
        
        const allValid = hasMinLength && hasNumber && hasCapital && hasSpecial && hasNoobular && hasMaxLength;
        
        if (!allValid) {
          if (!hasMinLength) {
            if (window.usernameAttempts >= 0) {
              status.textContent = 'Username must be at least 12 character(s)';
            }
            window.usernameAttempts++;
            return;
          }
          
          if (!hasNumber) {
            if (window.usernameAttempts >= 1) {
              status.textContent = 'Username must contain a(n) number(s)';
            }
            window.usernameAttempts++;
            return;
          }
          
          if (!hasCapital) {
            if (window.usernameAttempts >= 2) {
              status.textContent = 'Usernames must contain a(n) capital letter(s)';
            }
            window.usernameAttempts++;
            return;
          }
          
          if (!hasSpecial) {
            if (window.usernameAttempts >= 3) {
              status.textContent = 'Username must contain a(n) special character(s)';
            }
            window.usernameAttempts++;
            return;
          }
          
          if (!hasNoobular) {
            if (window.usernameAttempts >= 4) {
              status.textContent = 'Username must contain(s) I<3NOOBULAR';
            }
            window.usernameAttempts++;
            return;
          }
          
          if (!hasMaxLength) {
            if (window.usernameAttempts >= 5) {
              status.textContent = 'Username must be less than 13 character(s)';
            }
            window.usernameAttempts++;
            return;
          }
        }
        
        window.usernameAttempts++;
        
        const accounts = JSON.parse(localStorage.getItem('noobular-accounts') || '{}');
        
        if (accounts[username]) {
          status.textContent = 'Username already exists!';
          return;
        }
        
        accounts[username] = password;
        localStorage.setItem('noobular-accounts', JSON.stringify(accounts));
        localStorage.setItem('current-user', username);
        window.usernameAttempts = 0;
        updateSignInButton();
        
        status.textContent = 'Account created! Welcome, ' + username + '!';
        setTimeout(() => {
          hideSignIn();
          status.textContent = '';
          document.getElementById('username-input').value = '';
          document.getElementById('password-input').value = '';
        }, 1500);
      }

      // Handle report form submission
      document.getElementById('report-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const reportedUser = document.getElementById('reported-user').value;
        const category = document.getElementById('report-category').value;
        const description = document.getElementById('report-description').value;
        const reporterUser = document.getElementById('reporter-user').value;
        const statusDiv = document.getElementById('report-status');
        
        if (!reportedUser || !category || !description) {
          statusDiv.textContent = 'Please fill in all required fields!';
          statusDiv.style.color = 'red';
          return;
        }
        
        // Store report in localStorage
        const reports = JSON.parse(localStorage.getItem('noobular-reports') || '[]');
        const newReport = {
          reportedUser: reportedUser,
          category: category,
          description: description,
          reporterUser: reporterUser || 'Anonymous',
          timestamp: new Date().toLocaleString(),
          id: Date.now()
        };
        
        reports.push(newReport);
        localStorage.setItem('noobular-reports', JSON.stringify(reports));
        
        statusDiv.textContent = '✓ Report submitted successfully! Our moderators will review it.';
        statusDiv.style.color = 'green';
        statusDiv.style.fontSize = '20px';
        
        // Reset form
        setTimeout(() => {
          document.getElementById('report-form').reset();
          statusDiv.textContent = '';
        }, 3000);
      });
    </script>
